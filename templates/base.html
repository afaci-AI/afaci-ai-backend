<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food DB Admin</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav style="background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; margin-bottom: 2rem;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="font-weight: bold; font-size: 1.2rem; color: var(--primary); text-decoration: none;">Food Database</a>
            <span style="font-size: 0.9rem; color: #64748b;">Панель управления</span>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
