name: base-ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  ruff-sca:
    name: ruff
    runs-on: afaci-runner-01
    steps:
      - name: Checkout code by ruff
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Linting)
        run: ruff check .

      - name: Run Ruff (Format Check)
        run: ruff format --check .

  build:
    name: build
    runs-on: afaci-runner-01
    needs:
      - ruff-sca
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
    
      - run: docker build -t ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }} .
      - run: docker save ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }} -o image.tar
      
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v6
        with:
            name: docker-image
            path: image.tar
            retention-days: 1

  image-push:
    runs-on: afaci-runner-01
    needs: build
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v6
        with:
          name: docker-image

      - run: docker load -i image.tar
      - run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_REGISTRY }} -u "${{ secrets.NEXUS_USER }}" --password-stdin
      - run: docker push ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

      - name: Log out from Nexus
        if: always()
        run: docker logout ${{ secrets.NEXUS_REGISTRY }}

  deploy:
    runs-on: afaci-runner-01
    needs: image-push
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy to devops-server (external daemon)
        env:
          DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
          BACKEND_IMAGE: ${{ secrets.NEXUS_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM || 'HS256' }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES || '10080' }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT || '8000' }}
        run: |
          pwd
          ls -la
          docker compose -f - up -d --pull always < ${{ github.workspace }}/deploy/docker-compose.yml
  
