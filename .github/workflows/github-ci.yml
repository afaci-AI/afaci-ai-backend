name: base-ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  ruff-sca:
    name: ruff
    runs-on: afaci-runner-01
    steps:
      - name: Checkout code by ruff
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Linting)
        run: ruff check .

      - name: Run Ruff (Format Check)
        run: ruff format --check .

  build:
    name: build
    runs-on: afaci-runner-01
    needs:
      - ruff-sca
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
    
      - run: docker build -t $NEXUS_REGISTRY/$IMAGE_NAME:${{ github.sha }} .
      - run: docker save $NEXUS_REGISTRY/$IMAGE_NAME:${{ github.sha }} -o image.tar
      
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
            name: docker-image
            path: image.tar
            retention-days: 1

  image-push:
    runs-on: afaci-runner-01
    needs: build
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - run: docker load -i image.tar
      - run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login $NEXUS_REGISTRY -u "${{ secrets.NEXUS_USER }}" --password-stdin
      - run: docker push $NEXUS_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Log out from Nexus
        if: always()
        run: docker logout $NEXUS_REGISTRY
  
