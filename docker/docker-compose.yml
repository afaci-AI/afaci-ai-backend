name: afaci

networks:
  afaci-network:
    driver: bridge

volumes:
  afaci-pgdata:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # БД создана с LC_CTYPE=C — так историко сложилось в проекте (см. CLAUDE.md,
      # ILIKE не сворачивает регистр кириллицы, вся кириллица matching живёт в infrastructure/db).
      # Держим ту же локаль в контейнере, чтобы поведение совпадало с продом/локальной разработкой.
      POSTGRES_INITDB_ARGS: "--locale=C"
    volumes:
      - afaci-pgdata:/var/lib/postgresql/data
      # Всё, что положишь сюда (*.sql, *.sql.gz, *.sh), выполнится один раз
      # при первом запуске (на пустом volume). См. docker/db/init/README.md.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Проброшено наружу только для локальной отладки (psql/DBeaver с хоста).
      # Для прод-подобного окружения можно закомментировать.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - afaci-network

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - afaci-network

  frontend:
    build:
      context: ../../afaci-frontend
      dockerfile: Dockerfile
      # rewrites() в next.config.mjs резолвится на этапе `next build`, поэтому
      # BACKEND_URL нужен и здесь (build-time), и ниже в environment (runtime).
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    networks:
      - afaci-network
